<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="%VITE_APP_LOGO%" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-exclusive-round.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo-exclusive-round.png" />
    <link rel="apple-touch-icon" href="%VITE_APP_LOGO%" />
    <link rel="shortcut icon" href="/logo-exclusive-round.png" />
    <title>%VITE_APP_TITLE%</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Sistema completo de gestão náutica: reservas de embarcações, controle de abastecimentos, vistorias e pagamentos online. Exclusive Club - Sua marina digital." />
    <meta name="keywords" content="reserva de embarcações, gestão náutica, marina, clube náutico, abastecimento de combustível, vistoria de embarcações, pagamento online PIX, sistema de reservas, gestão de barcos, exclusive club" />
    <meta name="author" content="Exclusive Club" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_APP_TITLE% - Sistema de Gestão Náutica" />
    <meta property="og:description" content="Sistema completo de gestão náutica: reservas de embarcações, controle de abastecimentos, vistorias e pagamentos online." />
    <meta property="og:image" content="%VITE_APP_LOGO%" />
    <meta property="og:locale" content="pt_BR" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_APP_TITLE% - Sistema de Gestão Náutica" />
    <meta name="twitter:description" content="Sistema completo de gestão náutica: reservas de embarcações, controle de abastecimentos, vistorias e pagamentos online." />
    <meta name="twitter:image" content="%VITE_APP_LOGO%" />
    
    <!-- Structured Data (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "%VITE_APP_TITLE%",
      "description": "Sistema completo de gestão náutica: reservas de embarcações, controle de abastecimentos, vistorias e pagamentos online.",
      "image": "%VITE_APP_LOGO%",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "BR"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
