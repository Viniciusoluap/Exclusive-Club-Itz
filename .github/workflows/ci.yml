name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          echo "pwd=$(pwd)"
          ls -la
