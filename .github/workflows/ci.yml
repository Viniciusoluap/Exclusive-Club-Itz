name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node and npm version
        run: node --version && npm --version

      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps --prefer-offline

      - name: Show installed TypeScript version
        run: npx tsc --version

      - name: Type check
        run: npx tsc --noEmit
