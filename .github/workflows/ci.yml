name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Diagnose early
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PYEOF'
          import json, os, subprocess, urllib.request
          node_v = subprocess.run(['node', '--version'], capture_output=True, text=True).stdout.strip()
          npm_v = subprocess.run(['npm', '--version'], capture_output=True, text=True).stdout.strip()
          pnpm_v = subprocess.run(['pnpm', '--version'], capture_output=True, text=True).stdout.strip()
          body = f"## CI Step 1: checkout OK\n- node: {node_v}\n- npm: {npm_v}\n- pnpm: {pnpm_v or '(not installed)'}"
          payload = json.dumps({"body": body}).encode()
          url = f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments"
          req = urllib.request.Request(url, data=payload, headers={
            "Authorization": f"token {os.environ['GITHUB_TOKEN']}",
            "Content-Type": "application/json",
          })
          try:
            resp = urllib.request.urlopen(req)
            print(f"Posted: {resp.status}")
          except Exception as e:
            print(f"Failed: {e}")
          PYEOF

      - uses: pnpm/action-setup@v4

      - name: Diagnose after pnpm setup
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PYEOF'
          import json, os, subprocess, urllib.request
          pnpm_v = subprocess.run(['pnpm', '--version'], capture_output=True, text=True).stdout.strip()
          body = f"## CI Step 2: pnpm/action-setup OK\n- pnpm: {pnpm_v}"
          payload = json.dumps({"body": body}).encode()
          url = f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments"
          req = urllib.request.Request(url, data=payload, headers={
            "Authorization": f"token {os.environ['GITHUB_TOKEN']}",
            "Content-Type": "application/json",
          })
          try:
            resp = urllib.request.urlopen(req)
            print(f"Posted: {resp.status}")
          except Exception as e:
            print(f"Failed: {e}")
          PYEOF

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        id: install
        run: |
          set +e
          pnpm install --frozen-lockfile --ignore-scripts > /tmp/install.log 2>&1
          INSTALL_EXIT=$?
          echo "install_exit=$INSTALL_EXIT" >> "$GITHUB_OUTPUT"
          echo "## pnpm install (exit $INSTALL_EXIT)" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/install.log >> "$GITHUB_STEP_SUMMARY"
          exit $INSTALL_EXIT
        continue-on-error: true

      - name: Type check
        id: typecheck
        if: steps.install.outcome == 'success'
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc.log 2>&1
          TSC_EXIT=$?
          echo "tsc_exit=$TSC_EXIT" >> "$GITHUB_OUTPUT"
          echo "## tsc (exit $TSC_EXIT)" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/tsc.log >> "$GITHUB_STEP_SUMMARY"
          exit $TSC_EXIT
        continue-on-error: true

      - name: Post diagnosis
        if: (steps.install.outcome == 'failure' || steps.typecheck.outcome == 'failure') && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          TSC_STATUS: ${{ steps.typecheck.outcome }}
        run: |
          python3 - << 'PYEOF'
          import json, os, urllib.request

          install_log = open('/tmp/install.log').read()[-4000:] if os.path.exists('/tmp/install.log') else '(no install log)'
          tsc_log = open('/tmp/tsc.log').read()[-4000:] if os.path.exists('/tmp/tsc.log') else '(no tsc log)'

          body = (
            "## CI Diagnosis\n"
            f"- pnpm install: **{os.environ['INSTALL_STATUS']}**\n"
            f"- tsc: **{os.environ['TSC_STATUS']}**\n\n"
            "### pnpm install output\n```\n" + install_log + "\n```\n\n"
            "### tsc output\n```\n" + tsc_log + "\n```"
          )

          payload = json.dumps({"body": body}).encode()
          repo = os.environ['REPO']
          pr = os.environ['PR_NUMBER']
          url = f"https://api.github.com/repos/{repo}/issues/{pr}/comments"
          req = urllib.request.Request(url, data=payload, headers={
            "Authorization": f"token {os.environ['GITHUB_TOKEN']}",
            "Content-Type": "application/json",
          })
          try:
            resp = urllib.request.urlopen(req)
            print(f"Comment posted: {resp.status}")
          except Exception as e:
            print(f"Failed to post comment: {e}")
          PYEOF

      - name: Fail
        if: always() && (steps.install.outcome == 'failure' || steps.typecheck.outcome == 'failure')
        run: exit 1
