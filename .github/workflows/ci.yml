name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        id: install
        run: npm install --ignore-scripts --legacy-peer-deps --no-fund --no-audit --loglevel verbose 2>&1 | tee /tmp/npm.log; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Type check
        id: typecheck
        if: steps.install.outcome == 'success'
        run: npx tsc --noEmit 2>&1 | tee /tmp/tsc.log; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Report errors as PR comment
        if: (steps.install.outcome == 'failure' || steps.typecheck.outcome == 'failure') && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const npmLog = fs.existsSync('/tmp/npm.log')
              ? fs.readFileSync('/tmp/npm.log', 'utf8').slice(-2000)
              : '';
            const tscLog = fs.existsSync('/tmp/tsc.log')
              ? fs.readFileSync('/tmp/tsc.log', 'utf8').slice(-2000)
              : '';
            const installStatus = '${{ steps.install.outcome }}';
            const tscStatus = '${{ steps.typecheck.outcome }}';
            const body = `## CI Diagnosis\n- npm install: **${installStatus}**\n- tsc: **${tscStatus}**\n\n### npm output (last 2000 chars)\n\`\`\`\n${npmLog}\n\`\`\`\n\n### tsc output (last 2000 chars)\n\`\`\`\n${tscLog}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request?.number || context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail
        if: steps.install.outcome == 'failure' || steps.typecheck.outcome == 'failure'
        run: exit 1
