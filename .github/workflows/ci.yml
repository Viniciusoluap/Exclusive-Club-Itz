name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          echo "=== npm install ===" | tee /tmp/ci.log
          npm install --ignore-scripts --legacy-peer-deps --no-fund --no-audit 2>&1 | tee -a /tmp/ci.log
          echo "npm exit: $?" | tee -a /tmp/ci.log

      - name: Type check
        run: |
          echo "=== tsc --noEmit ===" | tee -a /tmp/ci.log
          npx tsc --noEmit 2>&1 | tee -a /tmp/ci.log
          TSC_EXIT=${PIPESTATUS[0]}
          echo "tsc exit: $TSC_EXIT" | tee -a /tmp/ci.log
          exit $TSC_EXIT

      - name: Post diagnosis on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=$(cat /tmp/ci.log 2>/dev/null | tail -200 | sed 's/"/\\"/g' | sed 's/\\/\\\\/g' | tr '\n' '|' | sed 's/|/\\n/g')
          BODY="## CI Failed\\n\`\`\`\\n${LOG}\\n\`\`\`"
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"$BODY\"}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            || echo "curl failed to post comment"
