name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Debug environment
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Lock file header:"
          head -5 pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --ignore-scripts 2>&1 | tee /tmp/install.log; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Type check
        id: typecheck
        if: steps.install.outcome == 'success'
        run: pnpm exec tsc --noEmit 2>&1 | tee /tmp/tsc.log; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Write summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- Install: **${{ steps.install.outcome }}**" >> $GITHUB_STEP_SUMMARY
          echo "- TypeCheck: **${{ steps.typecheck.outcome }}**" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/install.log ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### pnpm install (last 100 lines)" >> $GITHUB_STEP_SUMMARY
            printf '%s\n' '```' >> $GITHUB_STEP_SUMMARY
            tail -100 /tmp/install.log >> $GITHUB_STEP_SUMMARY
            printf '%s\n' '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f /tmp/tsc.log ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### tsc errors" >> $GITHUB_STEP_SUMMARY
            printf '%s\n' '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/tsc.log >> $GITHUB_STEP_SUMMARY
            printf '%s\n' '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: /tmp/*.log
          if-no-files-found: ignore

      - name: Post PR comment
        if: (steps.install.outcome == 'failure' || steps.typecheck.outcome == 'failure') && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const installLog = fs.existsSync('/tmp/install.log') ? fs.readFileSync('/tmp/install.log','utf8').slice(-3000) : '(not found)';
            const tscLog = fs.existsSync('/tmp/tsc.log') ? fs.readFileSync('/tmp/tsc.log','utf8').slice(-3000) : '(not found)';
            const lines = [
              '## CI Diagnosis',
              `- Install: **${{ steps.install.outcome }}**`,
              `- TypeCheck: **${{ steps.typecheck.outcome }}**`,
              '',
              '### Install output (last 3000 chars)',
              '```',
              installLog,
              '```',
              '',
              '### tsc output',
              '```',
              tscLog,
              '```',
            ];
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n'),
            });

      - name: Fail
        if: always() && (steps.install.outcome == 'failure' || steps.typecheck.outcome == 'failure')
        run: exit 1
