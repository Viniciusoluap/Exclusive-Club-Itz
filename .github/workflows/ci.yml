name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.18.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Diagnostics
        run: |
          node --version
          pnpm --version
          ls -la pnpm-lock.yaml package.json
          cat package.json | python3 -c "import sys,json; p=json.load(sys.stdin); print('deps:', len(p.get('dependencies',{})), 'devDeps:', len(p.get('devDependencies',{})), 'optional:', p.get('optionalDependencies','none'))"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit
