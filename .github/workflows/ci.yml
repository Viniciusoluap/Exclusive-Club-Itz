name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite disparar o CI manualmente, em qualquer branch.
  #
  # POR QUE: entre 03/08 e 06/08 o GitHub parou de disparar workflows (bloqueio
  # de orçamento de Actions) e não havia como perceber isso de dentro — um
  # commit sem execução é indistinguível de um commit ainda na fila. Com
  # workflow_dispatch dá para provocar uma execução e obter uma resposta
  # imediata: ou o CI roda, ou o erro do disparo diz exatamente o que impede.
  workflow_dispatch:

jobs:
  build-test:
    name: Type Check, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    # DATABASE_URL points at the ephemeral TiDB instance started below.
    # drizzle.config.ts and the test global setup both require it to be present.
    env:
      DATABASE_URL: mysql://root:@127.0.0.1:3306/test

    steps:
      - uses: actions/checkout@v4

      # Production is TiDB Cloud, not vanilla MySQL. We first tried mysql:8.0 as
      # a "faithful stand-in" (GitHub Actions `services:` only runs plain images,
      # it can't pass TiDB's custom startup flags) and it broke on a real,
      # already-in-production migration: 0033_good_lila_cheney.sql does
      # `ALTER TABLE ... DROP PRIMARY KEY` on 14 tables and never re-adds a key.
      # That is invalid on InnoDB/MySQL for an AUTO_INCREMENT column
      # (ER_WRONG_AUTO_KEY / errno 1075) but is valid on TiDB, which does not
      # require AUTO_INCREMENT columns to be covered by an explicit key the same
      # way InnoDB does. This migration already ran successfully against real
      # production, so it must not be rewritten here (Story 6 / Phase 1 owns
      # migration-history reconciliation) — CI has to match the engine that
      # actually accepts it. `--store=unistore` runs a fully standalone,
      # single-binary TiDB with an embedded mock KV store (no separate PD/TiKV
      # needed) — this is PingCAP's own documented lightweight setup for CI/test
      # use, and is MySQL wire-protocol compatible so drizzle-orm/mysql2 and
      # drizzle-kit work against it unchanged.
      - name: Start ephemeral TiDB (production-faithful, not vanilla MySQL)
        run: |
          docker run -d --name tidb --network host \
            pingcap/tidb:latest \
            --store=unistore --path="" -P 3306 --host=0.0.0.0 \
            --log-slow-query="" 2>&1 | tee /tmp/tidb-start.log

          echo "Waiting for TiDB to accept connections..."
          for i in $(seq 1 60); do
            if mysql -h 127.0.0.1 -P 3306 -uroot -e "SELECT 1;" >/dev/null 2>&1; then
              echo "TiDB is up after ${i}0s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::TiDB did not become ready in time"
              docker logs tidb || true
              exit 1
            fi
            sleep 10
          done

          mysql -h 127.0.0.1 -P 3306 -uroot -e "CREATE DATABASE IF NOT EXISTS test;"

          # Root cause (captured via TiDB's own log on the previous run):
          # [ddl:8200] "Unsupported drop primary key when the table is using
          # clustered index". This TiDB image defaults to
          # tidb_enable_clustered_index=INT_ONLY, so a fresh `allowed_clients`
          # (single-column int AUTO_INCREMENT PK) is created as a clustered-index
          # table — and 0033_good_lila_cheney.sql's `DROP PRIMARY KEY` on it (and
          # 13 other tables) is explicitly disallowed on clustered tables. Real
          # production TiDB Cloud accepted this migration, so its tables must be
          # non-clustered (older default / explicit setting from when they were
          # created). Disable clustering globally before any table exists, so
          # fresh CI tables match production's actual on-disk representation.
          mysql -h 127.0.0.1 -P 3306 -uroot -e "SET GLOBAL tidb_enable_clustered_index = 'OFF';"

      # pnpm is the project's package manager (packageManager: pnpm@10.33.4).
      # action-setup reads that field and installs the matching version.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Checkpoint after checkout
        run: |
          echo "ok" > /tmp/cp-checkout.txt
          node --version
          pnpm --version

      # --frozen-lockfile: fail if pnpm-lock.yaml is out of date instead of
      # silently resolving different versions (the SYS-15 bug we are fixing).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>&1 | tee /tmp/install.log; exit ${PIPESTATUS[0]}

      # Story 6 (Fase 1) update: the migration history is now a clean,
      # replayable baseline (drizzle/0000_initial_baseline.sql), so CI applies
      # it via `drizzle-kit migrate` — real journal replay, not a schema diff.
      # This is a strictly stronger gate than `push --force` was: it also
      # catches any future migration file that doesn't actually apply
      # cleanly to an empty database, which push's diff-based approach could
      # never detect.
      #
      # History: the previous ~65-file migration journal had two independent
      # bugs blocking `migrate` on an empty DB — `0033_good_lila_cheney.sql`
      # did `ALTER TABLE ... DROP PRIMARY KEY` on 14 tables without ever
      # re-adding a key, and 28 `MODIFY/ADD COLUMN ... DEFAULT
      # 'CURRENT_TIMESTAMP'` statements across 9 files used a quoted STRING
      # LITERAL instead of the bare keyword (both invalid DDL, rejected by
      # MySQL and TiDB alike: ER_WRONG_AUTO_KEY / [ddl:1067]). Since that SQL
      # could never have run as written, those files were never a faithful
      # record of what actually happened to production — production's real
      # schema was independently confirmed to match the current schema.ts
      # (via `push --force`, used as a stopgap since Story 1). The old
      # journal was archived to drizzle/_archive-pre-baseline/ (audit trail,
      # not deleted) and replaced with a single fresh baseline generated from
      # schema.ts — see drizzle/BASELINE.md for the full writeup.
      - name: Apply schema to ephemeral DB
        run: pnpm run db:migrate:ci 2>&1 | tee /tmp/db-migrate.log; exit ${PIPESTATUS[0]}

      # DIAGNOSTIC (always runs, even on failure above): drizzle-kit's CLI does
      # not reliably print the underlying SQL error to stdout/stderr on this
      # codepath. The TiDB server's own log has the real error/query, so
      # capture it unconditionally for the PR comment.
      - name: Dump TiDB server log (diagnostic)
        if: always()
        run: docker logs tidb --tail 300 > /tmp/tidb-server.log 2>&1 || true

      - name: Type check
        run: pnpm run check 2>&1 | tee /tmp/tsc-output.log; exit ${PIPESTATUS[0]}

      # ASAAS_API_KEY/ASAAS_WEBHOOK_TOKEN: sandbox-only credentials, set as repo
      # secrets (Settings > Secrets and variables > Actions). Tests that need
      # them skip gracefully via `it.skipIf` when the secrets aren't configured
      # (e.g. on forks, which don't get access to secrets) — see
      # docs/reviews/fase0-known-test-failures.md for which tests these are.
      - name: Run tests
        env:
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
        run: pnpm test 2>&1 | tee /tmp/test-output.log; exit ${PIPESTATUS[0]}

      - name: Build (production)
        run: pnpm run build 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

      - name: Post error to PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readTail = (path, maxLines) => {
              try {
                return fs.readFileSync(path, 'utf8').split('\n').slice(-maxLines).join('\n');
              } catch (e) { return null; }
            };
            const checkoutDone = fs.existsSync('/tmp/cp-checkout.txt');
            let body = `## CI Diagnostics\n\nCheckout step completed: **${checkoutDone}**\n\n`;

            const install = readTail('/tmp/install.log', 30);
            body += '### pnpm install (last 30 lines)\n```\n' + (install ?? '_not run_') + '\n```\n\n';

            const dbMigrate = readTail('/tmp/db-migrate.log', 30);
            body += '### drizzle-kit migrate (last 30 lines)\n```\n' + (dbMigrate ?? '_not run_') + '\n```\n\n';

            const tidbLog = readTail('/tmp/tidb-server.log', 150);
            body += '### TiDB server log — real error/query (last 150 lines)\n```\n' + (tidbLog ?? '_not run_') + '\n```\n\n';

            const tscRaw = (() => { try { return fs.readFileSync('/tmp/tsc-output.log', 'utf8'); } catch (e) { return null; } })();
            if (tscRaw) {
              const errors = tscRaw.split('\n').filter(l => l.includes('error TS'));
              body += '### tsc errors (' + errors.length + ' total)\n```\n' + (errors.join('\n') || '_none_') + '\n```\n\n';
            } else {
              body += '### tsc output\n```\n_not run_\n```\n\n';
            }

            const test = readTail('/tmp/test-output.log', 40);
            body += '### vitest (last 40 lines)\n```\n' + (test ?? '_not run_') + '\n```\n\n';

            const build = readTail('/tmp/build.log', 30);
            body += '### build (last 30 lines)\n```\n' + (build ?? '_not run_') + '\n```\n';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

  # ───────────────────────── Fluxos de ponta a ponta ─────────────────────────
  #
  # Story 24 / SYS-07. Sobe o sistema inteiro contra um banco descartável e
  # percorre pela TELA os caminhos que o clube não pode perder: reservar,
  # vistoriar (inclusive a recusa quando a foto falha) e abastecer.
  #
  # POR QUE EM JOB SEPARADO: são minutos a mais e falham por motivos diferentes
  # dos testes de unidade. Separado, o vermelho já diz em qual camada está o
  # problema, sem precisar abrir o log.
  #
  # NADA aqui toca produção nem a conta Asaas: banco criado e descartado na
  # execução, segredos de mentira, e o fluxo de PIX deliberadamente fora (é o
  # único que precisaria de credencial de sandbox).
  e2e:
    name: Fluxos de ponta a ponta
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DATABASE_URL: mysql://root:@127.0.0.1:3306/test

    steps:
      - uses: actions/checkout@v4

      # Mesmo TiDB efêmero do job acima, e pela mesma razão: produção é TiDB
      # Cloud, não MySQL. O detalhe do clustered index está explicado lá.
      - name: Start ephemeral TiDB
        run: |
          docker run -d --name tidb --network host \
            pingcap/tidb:latest \
            --store=unistore --path="" -P 3306 --host=0.0.0.0 \
            --log-slow-query="" 2>&1 | tee /tmp/tidb-start.log

          for i in $(seq 1 60); do
            if mysql -h 127.0.0.1 -P 3306 -uroot -e "SELECT 1;" >/dev/null 2>&1; then
              echo "TiDB is up after ${i}0s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::TiDB did not become ready in time"
              docker logs tidb || true
              exit 1
            fi
            sleep 10
          done

          mysql -h 127.0.0.1 -P 3306 -uroot -e "SET GLOBAL tidb_enable_clustered_index = 'OFF';"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O job E2E usa uma instância TiDB própria; sem replay do schema, os
      # fluxos de manutenção e inspeção falham com ER_NO_SUCH_TABLE antes de
      # testar a aplicação. O job principal já faz esta etapa acima.
      - name: Apply schema to E2E database
        run: pnpm run db:migrate:ci

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # As VITE_* precisam existir NA HORA DO BUILD: elas são substituídas no
      # bundle, não lidas em execução. Sem elas o HTML publicado sai com
      # "%VITE_APP_TITLE%" literal e a rota quebra ao decodificar — foi
      # exatamente o que aconteceu na primeira montagem deste ambiente.
      # São valores de teste, não credenciais.
      - name: Build (produção, com as VITE_* preenchidas)
        env:
          VITE_APP_ID: app-de-teste-e2e
          VITE_APP_TITLE: Exclusive Club
          VITE_ANALYTICS_ENDPOINT: ""
          VITE_ANALYTICS_WEBSITE_ID: ""
          VITE_APP_LOGO: ""
          VITE_OAUTH_PORTAL_URL: http://127.0.0.1:9/oauth
        run: pnpm run build

      - name: Rodar os fluxos
        run: pnpm run e2e

      # O rastro do Playwright é o que permite entender uma falha de CI sem ter
      # a máquina na mão: traz screenshot, DOM e rede do momento exato.
      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
