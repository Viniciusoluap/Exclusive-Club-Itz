name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        id: install
        run: npm install --ignore-scripts --legacy-peer-deps --no-fund --no-audit 2>&1 | tee /tmp/npm.log; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Type check
        id: typecheck
        if: steps.install.outcome == 'success'
        run: npx tsc --noEmit 2>&1 | tee /tmp/tsc.log; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Write summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- Install: **${{ steps.install.outcome }}**" >> $GITHUB_STEP_SUMMARY
          echo "- TypeCheck: **${{ steps.typecheck.outcome }}**" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/npm.log ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### npm install (last 100 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 /tmp/npm.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f /tmp/tsc.log ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### tsc errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/tsc.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post PR comment
        if: (steps.install.outcome == 'failure' || steps.typecheck.outcome == 'failure') && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const npmLog = fs.existsSync('/tmp/npm.log') ? fs.readFileSync('/tmp/npm.log','utf8').slice(-3000) : '(not found)';
            const tscLog = fs.existsSync('/tmp/tsc.log') ? fs.readFileSync('/tmp/tsc.log','utf8').slice(-3000) : '(not found)';
            const lines = [
              '## CI Diagnosis',
              `- npm install: **${{ steps.install.outcome }}**`,
              `- tsc: **${{ steps.typecheck.outcome }}**`,
              '',
              '### npm output (last 3000 chars)',
              '```',
              npmLog,
              '```',
              '',
              '### tsc output',
              '```',
              tscLog,
              '```',
            ];
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n'),
            });

      - name: Fail
        if: always() && (steps.install.outcome == 'failure' || steps.typecheck.outcome == 'failure')
        run: exit 1
