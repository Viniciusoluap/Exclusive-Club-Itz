name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      COREPACK_ENABLE_STRICT: "0"
      COREPACK_ENABLE_AUTO_PIN: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Disable corepack
        run: corepack disable || true

      - name: Install pnpm
        run: |
          npm install -g pnpm@10.33.4 2>&1 | tee /tmp/npm-install-pnpm.log
          PNPM_BIN=$(npm prefix -g)/bin
          echo "pnpm global bin: $PNPM_BIN"
          echo "$PNPM_BIN" >> $GITHUB_PATH

      - name: Show versions
        run: node --version && pnpm --version

      - name: Install dependencies
        run: pnpm install --no-optional --no-frozen-lockfile 2>&1 | tee /tmp/pnpm-install.log; exit ${PIPESTATUS[0]}

      - name: Type check
        run: pnpm check 2>&1 | tee /tmp/tsc-output.log; exit ${PIPESTATUS[0]}

      - name: Post error to PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readLog = (path, maxLines) => {
              try {
                const content = fs.readFileSync(path, 'utf8');
                const lines = content.split('\n');
                return lines.slice(Math.max(0, lines.length - maxLines)).join('\n');
              } catch(e) { return null; }
            };
            let body = '## CI Diagnostics (failure)\n\n';
            const npmLog = readLog('/tmp/npm-install-pnpm.log', 20);
            body += '### npm install -g pnpm\n```\n' + (npmLog ?? '_not run_') + '\n```\n\n';
            const installLog = readLog('/tmp/pnpm-install.log', 40);
            body += '### pnpm install\n```\n' + (installLog ?? '_not run_') + '\n```\n\n';
            const tscLog = readLog('/tmp/tsc-output.log', 100);
            body += '### tsc output\n```\n' + (tscLog ?? '_not run_') + '\n```\n';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });
