name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts 2>&1 | tee /tmp/npm-install.log; exit ${PIPESTATUS[0]}

      - name: Type check
        run: npm run check 2>&1 | tee /tmp/tsc-output.log; exit ${PIPESTATUS[0]}

      - name: Post error to PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readLog = (path, maxLines) => {
              try {
                const content = fs.readFileSync(path, 'utf8');
                const lines = content.split('\n');
                return lines.slice(Math.max(0, lines.length - maxLines)).join('\n');
              } catch(e) { return null; }
            };
            let body = '## CI Diagnostics (failure)\n\n';
            const installLog = readLog('/tmp/npm-install.log', 30);
            body += '### npm install (last 30 lines)\n```\n' + (installLog ?? '_not run_') + '\n```\n\n';
            const tscLog = readLog('/tmp/tsc-output.log', 100);
            body += '### tsc output\n```\n' + (tscLog ?? '_not run_') + '\n```\n';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });
