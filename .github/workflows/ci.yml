name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: |
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          which pnpm && pnpm --version || echo "pnpm: not found"
          which corepack && corepack --version || echo "corepack: not found"
          node -e "require('corepack')" 2>/dev/null && echo "corepack module: ok" || echo "corepack module: not found"

      - uses: pnpm/action-setup@v4

      - run: |
          echo "pnpm after setup: $(pnpm --version)"
          pnpm install --frozen-lockfile --ignore-scripts

      - run: npx tsc --noEmit
