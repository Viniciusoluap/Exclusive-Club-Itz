name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.18.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Diagnostics
        run: |
          echo "node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          echo "npm: $(npm --version)"
          ls -la pnpm-lock.yaml package.json package-lock.json 2>/dev/null || true

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee /tmp/pnpm-install.log; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Report install failure
        if: steps.install.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="❌ **pnpm install falhou**. Output:\n\`\`\`\n$(tail -50 /tmp/pnpm-install.log)\n\`\`\`"
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "$body"
          exit 1

      - name: Fail if install failed
        if: steps.install.outcome == 'failure' && github.event_name != 'pull_request'
        run: exit 1

      - name: Type check
        run: npx tsc --noEmit
