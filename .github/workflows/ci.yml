name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install --ignore-scripts --legacy-peer-deps --no-fund --no-audit 2>&1 | tee /tmp/install.log

      - name: Type check
        run: |
          npx tsc --noEmit 2>&1 | tee /tmp/tsc.log

      - name: Post diagnosis on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          INSTALL_OUT=$(cat /tmp/install.log 2>/dev/null | tail -150)
          TSC_OUT=$(cat /tmp/tsc.log 2>/dev/null | tail -150)
          BODY=$(jq -Rs --arg install "$INSTALL_OUT" --arg tsc "$TSC_OUT" \
            '"## CI Diagnosis\n### npm install\n```\n" + $install + "\n```\n### tsc\n```\n" + $tsc + "\n```"' \
            <<< "")
          curl -sf -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\": $BODY}" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            && echo "Comment posted" \
            || echo "Failed to post comment (exit $?)"
